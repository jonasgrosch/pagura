[package]
name = "pagura-host"
description = "Pagura session protocol over stdio, native and wasm32-wasip1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pagura.workspace = true

# The WASI module ships without bundled font and CMap data, keeping its
# download small; a host with data opts in. `cargo test --workspace`
# unifies `pagura`'s `bundled-data` on, so tools/check.py also lints and tests
# `-p pagura-host` alone and with all features.
[features]
default = []
bundled-data = ["pagura/bundled-data"]
cjk-fonts = ["pagura/cjk-fonts"]
# Exposes `protocol::javascript_constants` to the example that regenerates
# web/protocol_constants.mjs; products never enable it.
codegen = []

[[example]]
name = "protocol_constants"
required-features = ["codegen"]

[dev-dependencies]
pagura-testkit.workspace = true
