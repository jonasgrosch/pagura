[package]
name = "pagura-cli"
description = "The pagura command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Not documented: its docs would overwrite the facade's at target/doc/pagura.
[[bin]]
name = "pagura"
path = "src/main.rs"
doc = false

# The facade alone: everything the tool does is public API (ADR 0030).
[dependencies]
pagura.workspace = true

[features]
default = ["bundled-data"]
bundled-data = ["pagura/bundled-data"]
cjk-fonts = ["bundled-data", "pagura/cjk-fonts"]

[dev-dependencies]
pagura-testkit.workspace = true
