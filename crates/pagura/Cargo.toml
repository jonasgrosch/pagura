[package]
name = "pagura"
description = "Public facade of the Pagura PDF engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pagura-core.workspace = true
pagura-crypto.workspace = true
pagura-data = { workspace = true, optional = true }
pagura-document.workspace = true
pagura-extract.workspace = true
pagura-font.workspace = true
pagura-pki.workspace = true
pagura-raster.workspace = true
pagura-render = { package = "pagura-legacy", path = "../pagura-legacy" }
pagura-text.workspace = true
pagura-write.workspace = true

[features]
default = ["bundled-data"]
bundled-data = ["dep:pagura-data"]

cjk-fonts = ["bundled-data", "pagura-data/cjk-fonts"]

[dev-dependencies]
pagura-testkit.workspace = true
