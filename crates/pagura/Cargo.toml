[package]
name = "pagura"
description = "Public facade and command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pagura-data = { workspace = true, optional = true }
pagura-crypto.workspace = true
pagura-pki.workspace = true
pagura-core.workspace = true
pagura-document.workspace = true
pagura-raster.workspace = true
pagura-render.workspace = true
pagura-text.workspace = true
pagura-write.workspace = true

[features]
default = ["bundled-data"]
bundled-data = ["dep:pagura-data"]

cjk-fonts = ["bundled-data", "pagura-data/cjk-fonts"]

[dev-dependencies]
# The fuzz regression replay (tests/fuzz_regressions.rs) drives these
# crates through the same code as the fuzz targets.
pagura-codec.workspace = true
pagura-font.workspace = true
pagura-host.workspace = true
pagura-image.workspace = true
pagura-testkit.workspace = true
