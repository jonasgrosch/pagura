# Coverage-guided fuzzing with cargo-fuzz (libFuzzer). This is test tooling in
# its own workspace, like the benchmark adapters, and must never become a
# product dependency. libFuzzer is C++ and its entry points need `no_mangle`,
# so the one-line binaries in fuzz_targets/ cannot forbid unsafe code; the
# drivers in crates/pagura-fuzz do, and the product crates under test keep
# `forbid(unsafe_code)`. Run with the nightly toolchain: see fuzz/README.md.
[package]
name = "pagura-fuzz-targets"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
pagura-fuzz = { path = "../crates/pagura-fuzz" }

[[bin]]
name = "syntax"
path = "fuzz_targets/syntax.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filters"
path = "fuzz_targets/filters.rs"
test = false
doc = false
bench = false

