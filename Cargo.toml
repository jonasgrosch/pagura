[workspace]
members = [
    "crates/pagura-core",
    "crates/pagura-codec",
    "crates/pagura-crypto",
    "crates/pagura-document",
    "crates/pagura-raster",
    "crates/pagura-font",
    "crates/pagura-text",
    "crates/pagura-data",
    "crates/pagura-image",
    "crates/pagura-render",
    "crates/pagura-write",
    "crates/pagura-host",
    "crates/pagura-testkit",
    "crates/pagura",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jonasgrosch/pagura"
publish = false

[workspace.dependencies]
pagura = { path = "crates/pagura" }
pagura-codec = { path = "crates/pagura-codec" }
pagura-core = { path = "crates/pagura-core" }
pagura-crypto = { path = "crates/pagura-crypto" }
pagura-data = { path = "crates/pagura-data" }
pagura-document = { path = "crates/pagura-document" }
pagura-font = { path = "crates/pagura-font" }
pagura-host = { path = "crates/pagura-host" }
pagura-image = { path = "crates/pagura-image" }
pagura-raster = { path = "crates/pagura-raster" }
pagura-render = { path = "crates/pagura-render" }
pagura-testkit = { path = "crates/pagura-testkit" }
pagura-text = { path = "crates/pagura-text" }
pagura-write = { path = "crates/pagura-write" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_must_use = "deny"

# The idiomatic-Rust bar (CONTRIBUTING.md). `-D warnings` turns every warning into an error.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# PDF numbers are i64/f64 by definition; i64 -> f64 precision loss is inherent, not a bug.
cast_precision_loss = "allow"
# PDF and geometry vocabulary (DeviceRGB, CropBox, x0/y0) is not Rust identifiers.
doc_markdown = "allow"
similar_names = "allow"
many_single_char_names = "allow"
# Exact float comparison against PDF-defined constants (0, 1, identity) is intentional.
float_cmp = "allow"
module_name_repetitions = "allow"
# Its suggestion is a third-party crate; product dependencies are forbidden.
naive_bytecount = "allow"
must_use_candidate = "allow"
# Hostile input must never panic: product code returns errors instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.bench]
inherits = "release"
debug = 1
