name: jbig2-wrapper-parity
on:
  pull_request:
    paths:
      - 'crates/pagura-image/**'
      - 'crates/pagura/examples/jbig2_wrapper_parity.rs'
      - 'tools/jbig2_wrapper_parity.mjs'
      - 'tools/fixturegen/recovery_jbig2_wrapper.py'
      - 'corpus/generated/recovery_jbig2_wrapper/**'
      - 'corpus/manifests/recovery_jbig2_wrapper.json'
      - '.github/workflows/jbig2-wrapper-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jbig2-wrapper-parity-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
      - name: Build native and SIMD with the feature-selected provider
        run: |
          cargo build --release --locked -p pagura --features cjk-fonts --example jbig2_wrapper_parity -j2
          cargo build --release --locked -p pagura --features cjk-fonts --example jbig2_wrapper_parity --target wasm32-wasip1 -j2
      - name: Build scalar with overflow checks
        run: cargo build --release --locked -p pagura --features cjk-fonts --example jbig2_wrapper_parity --target wasm32-wasip1 --target-dir target/scalar -j2
        env:
          RUSTFLAGS: '-C target-feature=-simd128 -C overflow-checks=on'
      - name: Verify independent pixels, source context and explicit refusals
        run: node tools/jbig2_wrapper_parity.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jbig2-wrapper-parity
          path: jbig2-wrapper-parity-results.json
