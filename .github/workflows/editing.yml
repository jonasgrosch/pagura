name: editing-interoperability
on:
  pull_request:
    paths:
      - 'crates/pagura/src/editing/**'
      - 'crates/pagura/src/editing.rs'
      - 'crates/pagura/tests/editing.rs'
      - 'crates/pagura-write/**'
      - 'crates/pagura-document/**'
      - '.github/workflows/editing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reopen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Independent readers
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: Writer and editing regressions
        env:
          PAGURA_EDIT_OUTPUT: ${{ runner.temp }}/pagura-editing
        run: |
          cargo test --locked --offline -p pagura-write
          cargo test --locked --offline -p pagura --test editing
      - name: Reopen every saved fixture independently
        env:
          PAGURA_EDIT_OUTPUT: ${{ runner.temp }}/pagura-editing
        shell: bash
        run: |
          shopt -s nullglob
          files=("$PAGURA_EDIT_OUTPUT"/*.pdf)
          test "${#files[@]}" -ge 10
          qpdf --version
          pdfinfo -v
          for file in "$PAGURA_EDIT_OUTPUT"/originals/*.pdf; do
            echo "Original baseline: $file"
            qpdf --check "$file" || true
            pdfinfo "$file" || true
          done
          for file in "${files[@]}"; do
            qpdf --check "$file"
            pdfinfo "$file"
          done
