name: editing-interoperability
on:
  pull_request:
    paths:
      - 'crates/pagura/src/editing/**'
      - 'crates/pagura/src/editing.rs'
      - 'crates/pagura/tests/api/editing.rs'
      - 'crates/pagura-write/**'
      - 'crates/pagura-document/**'
      - 'crates/pagura-host/**'
      - 'web/**'
      - 'tools/editing_host_test.mjs'
      - 'tools/host_test.mjs'
      - 'tools/form_*test.mjs'
      - 'tools/viewer_navigation_test.mjs'
      - 'tools/tile_cache_test.mjs'
      - 'tools/thumbnail_pixels*'
      - 'crates/pagura-appearance/**'
      - '.github/workflows/editing.yml'
      - 'tools/editing_readers.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  thumbnail-pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Compare real Chrome thumbnail pixels
        run: python3 tools/thumbnail_pixels.py
      - name: Publish pixel evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thumbnail-pixels
          path: target/thumbnail-pixels/
          if-no-files-found: error
  reopen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      - name: Viewer navigation and thumbnail contracts
        run: |
          node tools/isolation_test.mjs
          node tools/viewer_navigation_test.mjs
          node tools/tile_cache_test.mjs
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-wasip1
      - name: Independent readers
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: Writer and editing regressions
        env:
          PAGURA_EDIT_OUTPUT: ${{ runner.temp }}/pagura-editing
        run: |
          cargo clippy --locked --offline -p pagura-write -p pagura -p pagura-host -p pagura-appearance -p pagura-raster --all-targets -- -D warnings
          cargo test --locked --offline -p pagura-write
          cargo test --locked --offline -p pagura --test api editing::
          cargo test --locked --offline -p pagura-appearance
          cargo test --locked --offline -p pagura-raster stroke::
          python3 -m unittest discover -s tools -p test_cloud_pixels.py
          python3 -m unittest discover -s tools -p test_rounded_pixels.py
          cargo test --locked --offline -p pagura-host
      - name: Check saved files and compare independent-reader baselines
        env:
          PAGURA_EDIT_OUTPUT: ${{ runner.temp }}/pagura-editing
        run: python3 tools/editing_readers.py
      - name: Build browser and native hosts
        run: |
          cargo build --locked --offline -p pagura-host
          cargo build --locked --offline --release -p pagura-host --target wasm32-wasip1
          cargo build --locked --offline --release -p pagura-host --features bundled-data --target-dir target/host-bundled
          cargo build --locked --offline --release -p pagura-host --features bundled-data --target wasm32-wasip1 --target-dir target/host-bundled
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      - name: Browser viewer and native/WASM parity
        run: node tools/host_test.mjs
      - name: Browser editing bridge
        run: |
          node tools/editing_host_test.mjs target/host-bundled/wasm32-wasip1/release/pagura-host.wasm
          for file in target/form-compatibility-*.pdf; do
            qpdf --check "$file"
            pdftoppm -f 1 -singlefile -scale-to 600 "$file" "${file%.pdf}"
          done
      - name: Publish browser module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editing-browser-wasm
          path: target/host-bundled/wasm32-wasip1/release/pagura-host.wasm
          if-no-files-found: error
