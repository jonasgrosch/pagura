name: font-directory-parity
on:
  pull_request:
    paths:
      - '.github/workflows/font-directory-parity.yml'
      - 'crates/**'
      - 'tools/font_directory*'
      - 'tools/fixturegen/**'
      - 'tools/fixtures.py'
      - 'corpus/generated/font_directory/**'
      - 'corpus/manifests/font_directory.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'rust-toolchain.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: font-directory-parity-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PAGURA_PYTHON: python
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Build and freeze each variant with one reclaimed compiler cache
        run: python tools/font_directory_build.py
      - name: Check all explicit native, SIMD and scalar font and render contracts
        run: node tools/font_directory_parity.mjs
      - name: Preserve actual modules, compiler provenance, raw attempts and outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: font-directory-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/font-directory-frozen
            target/font-directory-evidence
          if-no-files-found: error
          retention-days: 30
