name: functional-checks
# Pull requests run once on their own event; only main runs on push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to the same pull request supersedes its checks; main keeps every run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # Keep the check names that branch protection requires.
    name: check (${{ matrix.os }})
    strategy:
      # Report every platform; one failure must not cancel the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Same-repository integrate/* pull requests run their macOS job on the project's
    # own Mac runners; forks and every other branch use the hosted runners.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-wasip1
      # The host checks run the WASI module and worker threads under Node; the
      # runner images' default Node versions crashed intermittently there.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      - name: Verify all product contracts
        # npm ci installs the dev-only JavaScript tools exactly as package-lock.json pins them.
        run: npm ci && python tools/check.py
