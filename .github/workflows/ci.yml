name: functional-checks
# Pull requests run once on their own event; only main runs on push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to the same pull request supersedes its checks; main keeps every run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # Keep the check names that branch protection requires.
    name: check (${{ matrix.os }})
    strategy:
      # Report every platform; one failure must not cancel the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Same-repository integrate/* pull requests run their macOS job on the project's
    # own Mac runners; forks and every other branch use the hosted runners.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-wasip1
      # The host checks run the WASI module and worker threads under Node; the
      # runner images' default Node versions crashed intermittently there.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      # The runner images' default Python changes underneath us; .python-version pins it.
      # 3.13, not 3.14: Windows builds of 3.14 use zlib-ng, which changes Flate fixture bytes.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
      - name: Install pinned Python lint tools
        run: uv sync --locked --only-group lint
        env:
          UV_PYTHON_DOWNLOADS: never
      - name: Verify all product contracts
        run: python tools/check.py
