name: font-descriptor-parity
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'tools/font_descriptor_parity.mjs'
      - 'tools/fixturegen/recovery_font_descriptor.py'
      - 'corpus/manifests/recovery_font_descriptor.json'
      - 'benchmarks/probes/font-descriptor-fixtures.json'
      - '.github/workflows/font-descriptor-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: font-descriptor-parity-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  oracle:
    runs-on: ubuntu-latest
    env:
      PAGURA_QUAL_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
      - name: Build native and SIMD controls
        run: |
          cargo build --release --locked --offline -p pagura --example font_descriptor_parity --features bundled-data,cjk-fonts
          cargo build --release --locked --offline -p pagura --example font_descriptor_parity --features bundled-data,cjk-fonts --target wasm32-wasip1
      - name: Build scalar controls with overflow checks
        run: cargo build --release --locked --offline -p pagura --example font_descriptor_parity --features bundled-data,cjk-fonts --target wasm32-wasip1 --target-dir target/scalar
        env:
          RUSTFLAGS: '-C target-feature=-simd128 -C overflow-checks=on'
      - name: Verify source, pixels, errors and text geometry
        run: node tools/font_descriptor_parity.mjs
