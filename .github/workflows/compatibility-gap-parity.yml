name: compatibility-gap-parity
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'tools/compatibility_gap_parity.mjs'
      - 'tools/fixturegen/**'
      - 'corpus/manifests/**'
      - 'benchmarks/probes/compatibility-gap-fixtures.json'
      - '.github/workflows/compatibility-gap-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-gap-parity-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false
jobs:
  oracle:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
      - name: Build native and SIMD controls
        run: |
          cargo build --release --locked -p pagura --example compatibility_gap_parity
          cargo build --release --locked -p pagura --example compatibility_gap_parity --target wasm32-wasip1
      - name: Build scalar controls with overflow checks
        run: cargo build --release --locked -p pagura --example compatibility_gap_parity --target wasm32-wasip1 --target-dir target/scalar
        env:
          RUSTFLAGS: '-C target-feature=-simd128 -C overflow-checks=on'
      - name: Verify complete independent pixels, strict behavior and retained refusals
        run: node tools/compatibility_gap_parity.mjs
