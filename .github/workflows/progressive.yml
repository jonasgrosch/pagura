name: progressive-source-jobs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: progressive-source-jobs-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Check source and facade contracts
        run: cargo clippy -p pagura-core -p pagura-codec -p pagura-document -p pagura-content -p pagura-image -p pagura-text -p pagura-appearance -p pagura-extract -p pagura-interpret -p pagura-raster -p pagura-paint -p pagura-render -p pagura -p pagura-cli -p pagura-host --all-targets --all-features --keep-going -- -D warnings
      - name: Verify complete and extendable parser windows
        run: cargo test -p pagura-core
      - name: Verify complete-document and sparse-window contracts
        run: cargo test -p pagura-document
      - name: Verify facade source contract
        run: 'cargo test -p pagura --test api source::'
      - name: Verify source-backed content and image ownership
        run: |
          cargo test -p pagura-content
          cargo test -p pagura-image source::
      - name: Verify public attachment metadata and image services
        run: cargo test -p pagura --test document_services
      - name: Verify shared glyph-store callers
        run: cargo test -p pagura-raster band::glyph::tests
      - name: Verify the canonical executor and owned band lifecycle
        run: cargo test -p pagura-paint
      - name: Verify public owned output against independent image oracles
        run: 'cargo test -p pagura --test api session::'
      - name: Verify rendered PNG streaming and alpha conversion
        run: 'cargo test -p pagura --test api png::'
      - name: Verify incremental codecs and independent decoder fixtures
        run: cargo test -p pagura-codec
